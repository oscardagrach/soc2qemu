arm,cortex-a9-gic:      {qom_type: a9mpcore_priv, fit: props, notes: "comes with SCU/TWD inside a9mpcore_priv", verified: 2026-10-16}
arm,gic-v3:             {qom_type: arm-gicv3, fit: props, notes: "num-irq = SPIs + 32; redist-region-count; has-security-extensions if EL3", verified: 2026-10-16}
arm,gic-v3-its:         {qom_type: arm-gicv3-its, fit: props, verified: 2026-10-16}
arm,gic-v2m-frame:      {qom_type: arm-gicv2m, fit: props, verified: 2026-10-16}
arm,armv8-timer:        {qom_type: null, fit: drop-in, notes: "generic timer is part of the CPU; wire CPU timer outputs to GIC PPIs (see fsl-imx8mp.c)", verified: 2026-10-16}
arm,armv7-timer:        {qom_type: null, fit: drop-in, notes: "as above", verified: 2026-10-16}
arm,cortex-a9-twd-timer: {qom_type: arm_mptimer, fit: drop-in, notes: "usually via a9mpcore_priv", verified: 2026-10-16}

