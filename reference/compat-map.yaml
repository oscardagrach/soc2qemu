# Devicetree compatible -> existing QEMU model. Seed list, checked against upstream QEMU 11.1.50
# (2026-10-16). Before relying on an entry, confirm the type still exists:
#   grep -rn 'define TYPE_.*"<qom_type>"' worktrees/<soc>/include worktrees/<soc>/hw
# "fit" says how often the model works unmodified: drop-in | props | partial (expect quirks).
# Add entries as ports discover new matches; keep `verified` honest.

arm,pl011:              {qom_type: pl011, fit: drop-in, verified: 2026-10-16}
arm,sbsa-uart:          {qom_type: pl011, fit: partial, notes: "SBSA subset; pl011 superset usually fine", verified: 2026-10-16}
ns16550a:               {qom_type: serial-mm, fit: props, notes: "regshift 0 unless reg-shift in DTS", verified: 2026-10-16}
ns16550:                {qom_type: serial-mm, fit: props, verified: 2026-10-16}
snps,dw-apb-uart:       {qom_type: serial-mm, fit: props, notes: "regshift=2 (reg-shift = <2>); DW extras (USR @0x7c) not modeled - add an unimp/overlay if firmware polls USR", verified: 2026-10-16}
cdns,uart-r1p12:        {qom_type: cadence_uart, fit: drop-in, verified: 2026-10-16}
xlnx,xuartps:           {qom_type: cadence_uart, fit: drop-in, verified: 2026-10-16}
arm,cmsdk-uart:         {qom_type: cmsdk-apb-uart, fit: drop-in, verified: 2026-10-16}

arm,gic-400:            {qom_type: arm_gic, fit: props, notes: "revision=2; num-irq = SPIs + 32", verified: 2026-10-16}
