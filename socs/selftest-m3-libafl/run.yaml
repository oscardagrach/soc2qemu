# Self-test of the libafl base: same fixture as selftest-m3, built on qemu-libafl-bridge (expected: stall after stage1).
machine: mps2-an385
qemu: auto
timeout: 20
stall_seconds: 3
args: [-kernel, "${KIT_ROOT}/tests/fixture-m3/fixture.elf"]
milestones:
  - {name: stage1, regex: "fixture: stage1"}
  - {name: stage2, regex: "fixture: stage2"}
